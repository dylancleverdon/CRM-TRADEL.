name: Build & Release

# Every push builds the Mac app + Android APK and publishes them as the "latest" GitHub release.
# Both apps check that release and update themselves automatically.
on:
  push:
    branches: [main, master, 'claude/admiring-knuth-2gio93']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_OUTPUT"

  sync-check:
    # Verifies the Google Sheet sync endpoint the apps use is reachable and can read + write.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Ping and round-trip the Apps Script endpoint
        run: |
          URL=$(grep -o "https://script.google.com/macros/s/[^']*/exec" src/lib/sync.ts | head -1)
          post() { curl -sSL -H 'Content-Type: text/plain' --data "$1" "$URL"; }
          echo "Endpoint: $URL"
          echo "--- diagnostics (GET)"
          curl -sSL -o get.html -w "final_url=%{url_effective} http=%{http_code}\n" "$URL?action=ping" || true
          grep -o '<title>[^<]*</title>' get.html || true
          sed -e 's/<[^>]*>/ /g' get.html | tr -s ' \n' ' ' | grep -o -i -E '(script function not found[^.]*|sign in[^.]{0,80}|page not found[^.]{0,80}|sorry[^.]{0,120}|authorization is required[^.]*|exception[^.]{0,200})' | head -5 || true
          head -c 300 get.html | grep -q '^{' && head -c 600 get.html; echo
          echo "--- ping"
          post '{"action":"ping"}' | tee ping.json | head -c 1500; echo
          NOW=$(date -u +%FT%T.000Z)
          echo "--- write healthcheck row to settings tab"
          post "{\"action\":\"sync\",\"since\":0,\"changes\":{\"settings\":[{\"id\":\"_healthcheck\",\"value\":\"$NOW\",\"updatedAt\":\"$NOW\"}]}}" | head -c 600; echo
          echo "--- read it back"
          post '{"action":"sync","since":0,"changes":{}}' > read.json
          head -c 1500 read.json; echo
          echo "--- ring-my-phone relay"
          if post '{"action":"callPoll"}' | grep -q '"ok":true'; then echo "RING_PHONE_READY"; else echo "RING_PHONE_NEEDS_SCRIPT_UPDATE (paste the latest apps-script/Code.gs and deploy a new version)"; fi
          if grep -q '"ok":true' ping.json && grep -q "$NOW" read.json; then echo "SYNC_CHECK_PASSED"; else echo "SYNC_CHECK_FAILED"; exit 1; fi

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
      - run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - run: npx vite build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk TradeLink-CRM.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: TradeLink-CRM.apk }

  mac:
    needs: version
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - run: npx vite build
      - run: npx electron-builder --mac dir --universal --publish never
      - run: bash scripts/package-mac.sh "$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: out/* }

  release:
    needs: [version, android, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Prepare release files
        run: |
          V="${{ needs.version.outputs.version }}"
          cp scripts/install-mac.sh artifacts/install-mac.sh
          sed "s/__CODE_VERSION__/$V/" apps-script/Code.gs > artifacts/Code.gs
          printf '{"version":"%s","date":"%s","commit":"%s"}\n' "$V" "$(date -u +%FT%TZ)" "${GITHUB_SHA::7}" > artifacts/latest.json
          ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: TradeLink CRM v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          body: |
            **Android:** download `TradeLink-CRM.apk` on your phone and open it.
            **Mac (automatic):** open Terminal and run
            `curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-mac.sh | bash`
            **Mac (installer):** `TradeLink-CRM-Installer.pkg` (or the `.dmg`).

            Both apps update themselves automatically from this page.
          files: |
            artifacts/TradeLink-CRM.apk
            artifacts/TradeLink-CRM-mac.zip
            artifacts/TradeLink-CRM.dmg
            artifacts/TradeLink-CRM-Installer.pkg
            artifacts/install-mac.sh
            artifacts/latest.json
            artifacts/Code.gs
      - name: Push the new sync code to the Google Sheet (auto-update loader)
        continue-on-error: true
        run: |
          URL=$(grep -o "https://script.google.com/macros/s/[^']*/exec" src/lib/sync.ts | head -1)
          post() { curl -sSL -H 'Content-Type: text/plain' --data "$1" "$URL"; }
          sleep 5
          echo "--- reload"; post '{"action":"tlReload"}' | head -c 400; echo
          echo "--- ping";   post '{"action":"ping"}'     | head -c 400; echo
